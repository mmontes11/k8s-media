apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: photoprism-xiaowen
spec:
  sourcePVC: photoprism-xiaowen
  trigger:
    # schedule: "0 0 * * *"
    manual: xiaowen-5
  restic:
    repository: restic-xiaowen
    retain:
      daily: 7
    pruneIntervalDays: 14
    unlock: xiaowen-1
    # Direct method is required to inherit tolerations from Pod.
    copyMethod: Direct
    moverResources:
      requests:
        cpu: 1
        memory: 300Mi
      limits:
        memory: 4Gi
    cacheCapacity: 10Gi
    cacheStorageClassName: topolvm
    cacheAccessModes:
      - ReadWriteOnce
