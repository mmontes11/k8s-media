apiVersion: k8s.mariadb.com/v1alpha1
kind: Backup
metadata:
  name: backup-xiaowen
spec:
  mariaDbRef:
    name: mariadb-xiaowen
  schedule:
    cron: "0 22 * * *"
    suspend: false
  maxRetention: 168h # 7 days
  compression: bzip2
  storage:
    s3:
      bucket: database
      prefix: mariadb-xiaowen/logical
      endpoint: seaweedfs-s3.storage.svc.cluster.local:8333
      accessKeyIdSecretKeyRef:
        name: mariadb-xiaowen
        key: access-key-id
      secretAccessKeySecretKeyRef:
        name: mariadb-xiaowen
        key: secret-access-key
  logLevel: info
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2